name: grace_match
description: "GraceMatch – Premium Telugu Christian Matrimony"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ────────────────────────────── 
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # ─── Navigation & Deep Links ─────────────────────────
  go_router: ^15.1.2
  app_links: ^6.4.0

  # ─── Networking ───────────────────────────────────────
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0

  # ─── Dependency Injection ─────────────────────────────
  get_it: ^8.0.3

  # ─── Local Storage ────────────────────────────────────
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # ─── Firebase ─────────────────────────────────────────
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # ─── UI / Animations ──────────────────────────────────
  flutter_animate: ^4.5.2
  lottie: ^3.3.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  pinput: ^5.0.0
  flutter_svg: ^2.0.10+1

  # ─── Media ────────────────────────────────────────────
  image_picker: ^1.1.2
  video_player: ^2.9.2

  # ─── Payments ─────────────────────────────────────────
  razorpay_flutter: ^1.4.4

  # ─── Utilities ────────────────────────────────────────
  intl: ^0.20.2
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  share_plus: ^10.1.4
  package_info_plus: ^8.3.0
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1

  # ─── Fonts ────────────────────────────────────────────
  google_fonts: ^6.2.1
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
